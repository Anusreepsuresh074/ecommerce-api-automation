[pytest]
# --tb=short: the long traceback prints every frame's arguments (credentials, tokens) into the report.
addopts = --strict-markers --tb=short --alluredir=reports/allure-results
# An xfail that unexpectedly passes fails the run (every known-defect marker already sets strict=True).
xfail_strict = true
# A plain run (and every -m selection) is the API suite only. The offline framework tests in
# tests/unit/ run on their own: pytest tests/unit
testpaths = tests/auth tests/products
markers =
    smoke: fast PR-gating subset, run on every push
    regression: full suite, run nightly
    auth: auth feature (login, current user, refresh)
    products: products feature (incl. its Bearer-protected mirror)
    slow: waits for a real token to expire (~65 s)
    unit: offline tests of the framework itself (redaction, JWT utils, report steps, assertions)
