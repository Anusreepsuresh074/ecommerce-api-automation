[project]
name = "ecommerce-api-automation"
version = "1.0.0"
description = "Python + pytest API test automation for DummyJSON"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".claude", "context", "skills", "agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]
